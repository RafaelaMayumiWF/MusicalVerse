<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="./js/sessao.js"></script>

    <title>MusicalVerse - Cadastro</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/background.css" />
  </head>

  <body id="loginCadastro">
    <div class="fundo-animado">
      <!-- Ondas que expandem (3 grupos em posições diferentes) -->
      <div class="onda onda-1"></div>
      <div class="onda onda-2"></div>
      <div class="onda onda-3"></div>

      <div class="onda onda-4"></div>
      <div class="onda onda-5"></div>
      <div class="onda onda-6"></div>

      <div class="onda onda-7"></div>
      <div class="onda onda-8"></div>

      <!-- Losangos flutuando -->
      <div class="losango losango-1"></div>
      <div class="losango losango-2"></div>
      <div class="losango losango-3"></div>
      <div class="losango losango-4"></div>
      <div class="losango losango-5"></div>

      <!-- Linhas que cruzam a tela -->
      <div class="linha linha-1"></div>
      <div class="linha linha-2"></div>
      <div class="linha linha-3"></div>
      <div class="linha linha-4"></div>
      <div class="linha linha-5"></div>

      <!-- Luzes de fundo suaves -->
      <div class="luz luz-1"></div>
      <div class="luz luz-2"></div>
      <div class="luz luz-3"></div>
    </div>
    <main>
      <a href="./index.html" id="inicioBtn">Inicio</a>

      <section class="lado1">
        <img src="../assets/img/avatar.png" alt="" />
        <h2>Cadastro</h2>

        <div>
          <input type="text" placeholder="Nome" id="nome_input" />
        </div>

        <div>
          <input
            type="email"
            placeholder="E-mail"
            id="email_input"
            onkeyup="validarEmail()"
          />

          <p id="mensagemEmail"></p>
        </div>

        <div>
          <input
            type="password"
            placeholder="Senha"
            id="senha_input"
            onkeyup="validarSenha()"
          />
        </div>

        <div>
          <input
            type="password"
            placeholder="Confirmar senha"
            id="confirmacao_senha_input"
            onkeyup="validarConfirmacao()"
          />

          <p id="mensagemConfirmacao"></p>
        </div>

        <button onclick="cadastrar()">Cadastrar</button>
      </section>

      <section class="lado2">
        <div>
          <h2>Já tem uma conta?</h2>
          <p>
            Acesse sua conta existente! <a href="./login.html">Acessar Conta</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>

<script>
  function validarEmail() {
    var email = email_input.value;

    var valido = email.includes("@") && email.includes(".");

    if (valido) {
      mensagemEmail.innerHTML = "✔ Email válido";

      mensagemEmail.style.color = "lime";
    } else {
      mensagemEmail.innerHTML = "Email inválido";

      mensagemEmail.style.color = "red";
    }
  }

  function validarSenha() {
    var senha = senha_input.value;

    var temMaiuscula = false;
    var temMinuscula = false;
    var temNumero = false;
    var temEspecial = false;

    var especiais = "!@#$%¨&*()_+-=<>?";

    for (var i = 0; i < senha.length; i++) {
      var caractere = senha[i];

      if (caractere >= "A" && caractere <= "Z") {
        temMaiuscula = true;
      }

      if (caractere >= "a" && caractere <= "z") {
        temMinuscula = true;
      }

      if (caractere >= "0" && caractere <= "9") {
        temNumero = true;
      }

      if (especiais.includes(caractere)) {
        temEspecial = true;
      }
    }

    var temTamanho = senha.length >= 8;

    atualizarMensagem(maiuscula, temMaiuscula);

    atualizarMensagem(minuscula, temMinuscula);

    atualizarMensagem(numero, temNumero);

    atualizarMensagem(especial, temEspecial);

    atualizarMensagem(tamanho, temTamanho);
  }

  function atualizarMensagem(elemento, valido) {
    var texto = elemento.innerHTML.slice(2);

    if (valido) {
      elemento.innerHTML = "✔ " + texto;

      elemento.style.color = "lime";
    } else {
      elemento.innerHTML = "X " + texto;

      elemento.style.color = "red";
    }
  }

  function validarConfirmacao() {
    if (senha_input.value == confirmacao_senha_input.value) {
      mensagemConfirmacao.innerHTML = "✔ Senhas iguais";

      mensagemConfirmacao.style.color = "lime";
    } else {
      mensagemConfirmacao.innerHTML = "❌ Senhas diferentes";

      mensagemConfirmacao.style.color = "red";
    }
  }

  function cadastrar() {
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;

    if (nomeVar == "" || emailVar == "" || senhaVar == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "(erro)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // ver isso aqui
  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
