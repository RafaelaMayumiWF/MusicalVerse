<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exemplo - Quiz</title>
    <link rel="stylesheet" href="./css/background.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./js/sessao.js"></script>
  </head>

  <body onload="onloadEsconder()">
    <div class="fundo-animado">
      <!-- Ondas que expandem (3 grupos em posições diferentes) -->
      <div class="onda onda-1"></div>
      <div class="onda onda-2"></div>
      <div class="onda onda-3"></div>

      <div class="onda onda-4"></div>
      <div class="onda onda-5"></div>
      <div class="onda onda-6"></div>

      <div class="onda onda-7"></div>
      <div class="onda onda-8"></div>

      <!-- Losangos flutuando -->
      <div class="losango losango-1"></div>
      <div class="losango losango-2"></div>
      <div class="losango losango-3"></div>
      <div class="losango losango-4"></div>
      <div class="losango losango-5"></div>

      <!-- Linhas que cruzam a tela -->
      <div class="linha linha-1"></div>
      <div class="linha linha-2"></div>
      <div class="linha linha-3"></div>
      <div class="linha linha-4"></div>
      <div class="linha linha-5"></div>

      <!-- Luzes de fundo suaves -->
      <div class="luz luz-1"></div>
      <div class="luz luz-2"></div>
      <div class="luz luz-3"></div>
    </div>
    <div id="pontuacaoEJogo">
      <button id="btnIniciarQuiz" onclick="iniciarQuiz()">INICIAR QUIZ</button>

      <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
        <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">
          <span class="width-fit-content"
            >Acertos: <span id="spanCertas"></span
          ></span>
          <span class="width-fit-content"
            >Erros: <span id="spanErradas"></span
          ></span>
        </div>
        <div id="pontuacaoFinalJogo" class="flex-colunar padding-8">
          <span id="pontuacaoFinal" class="width-fit-content"
            >Pontuação Final:
            <span id="spanPontuacaoFinal">***</span>
          </span>
          <span id="msgFinal" class="width-fit-content">***</span>
        </div>
      </div>

      <div id="jogo" class="width-fit-content flex-colunar border-secondary">
        <div id="infoQuestao" class="padding-8">
          <span
            >Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de
            <span id="qtdQuestoes"></span> questões.</span
          >
        </div>
        <section>
          <article>
            <div id="perguntaDaQuestaoAtual" class="padding-8">
              <span id="spanQuestaoExibida" class="text-bold"></span>
            </div>
          </article>
          <article>
            <div id="infoAlternativas" class="padding-8">
              <span><em>Escolha uma opção dentre as abaixo:</em></span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
              <span>
                <input
                  type="radio"
                  id="primeiraOpcao"
                  name="option"
                  class="radio"
                  value="alternativaA"
                />
                <label
                  for="primeiraOpcao"
                  class="option"
                  id="labelOpcaoUm"
                ></label>
              </span>
              <span>
                <input
                  type="radio"
                  id="segundaOpcao"
                  name="option"
                  class="radio"
                  value="alternativaB"
                />
                <label
                  for="segundaOpcao"
                  class="option"
                  id="labelOpcaoDois"
                ></label>
              </span>
              <span>
                <input
                  type="radio"
                  id="terceiraOpcao"
                  name="option"
                  class="radio"
                  value="alternativaC"
                />
                <label
                  for="terceiraOpcao"
                  class="option"
                  id="labelOpcaoTres"
                ></label>
              </span>
              <span>
                <input
                  type="radio"
                  id="quartaOpcao"
                  name="option"
                  class="radio"
                  value="alternativaD"
                />
                <label
                  for="quartaOpcao"
                  class="option"
                  id="labelOpcaoQuatro"
                ></label>
              </span>
            </div>
          </article>
        </section>

        <div id="botoes" class="flex-colunar padding-8">
          <button onclick="submeter()" id="btnSubmeter">
            Submeter resposta
          </button>
          <button onclick="avancar()" id="btnProx" disabled>
            Avançar para próxima questão
          </button>
          <!-- <button onclick="finalizar()" id="btnConcluir" disabled>Finalizar Quiz</button> -->
          <button onclick="tentarNovamente()" id="btnTentarNovamente" disabled>
            Tentar novamente
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
<script>
  const listaDeQuestoes = [
  {
    pergunta:
      "Qual era a origem de Alexander Hamilton antes de chegar às colônias americanas?",
    alternativaA: "Jamaica",
    alternativaB: "Barbados",
    alternativaC: "Porto Rico",
    alternativaD: "Nevis",
    alternativaE: "Trinidad",
    alternativaCorreta: "alternativaD",
  },

  {
    pergunta:
      "Durante “The Room Where It Happens”, qual é a principal frustração de Aaron Burr?",
    alternativaA: "Não conseguir riqueza suficiente",
    alternativaB: "Não participar das decisões políticas importantes",
    alternativaC: "Ser rejeitado por Eliza",
    alternativaD: "Perder seu posto militar",
    alternativaE: "Não conseguir apoio francês",
    alternativaCorreta: "alternativaB",
  },

  {
    pergunta:
      "Qual personagem canta a maior parte de “Satisfied”, revisitando acontecimentos anteriores sob outra perspectiva?",
    alternativaA: "Eliza Schuyler",
    alternativaB: "Maria Reynolds",
    alternativaC: "Angelica Schuyler",
    alternativaD: "Peggy Schuyler",
    alternativaE: "The Bullet",
    alternativaCorreta: "alternativaC",
  },

  {
    pergunta:
      "O que levou John Laurens a deixar o grupo principal durante a guerra?",
    alternativaA: "Foi promovido pelo Congresso",
    alternativaB: "Precisava retornar ao sul para recrutar soldados negros",
    alternativaC: "Brigou com Hamilton",
    alternativaD: "Foi capturado pelos britânicos",
    alternativaE: "Casou-se e abandonou o exército",
    alternativaCorreta: "alternativaB",
  },

  {
    pergunta:
      "Qual foi a principal consequência pública do Reynolds Pamphlet?",
    alternativaA: "Hamilton ganhou apoio político",
    alternativaB: "Burr perdeu sua candidatura",
    alternativaC: "O caso extraconjugal de Hamilton foi exposto",
    alternativaD: "Washington renunciou imediatamente",
    alternativaE: "Jefferson foi preso por corrupção",
    alternativaCorreta: "alternativaC",
  },

  {
    pergunta:
      "Em “Wait For It”, qual característica Aaron Burr acredita diferenciar Hamilton dele?",
    alternativaA: "Prudência",
    alternativaB: "Paciência",
    alternativaC: "Controle emocional",
    alternativaD: "Impulsividade",
    alternativaE: "Inteligência militar",
    alternativaCorreta: "alternativaD",
  },

  {
    pergunta:
      "Qual personagem se torna vice-presidente antes do duelo final?",
    alternativaA: "James Madison",
    alternativaB: "George Washington",
    alternativaC: "Thomas Jefferson",
    alternativaD: "Aaron Burr",
    alternativaE: "Philip Hamilton",
    alternativaCorreta: "alternativaD",
  },

  {
    pergunta:
      "O que George Washington aconselha Hamilton repetidamente ao longo da história?",
    alternativaA: "Casar-se por influência política",
    alternativaB: "Evitar confrontos públicos desnecessários",
    alternativaC: "Desafiar Burr antes que seja tarde",
    alternativaD: "Abandonar a política e voltar ao Caribe",
    alternativaE: "Tornar-se diplomata na França",
    alternativaCorreta: "alternativaB",
  },

  {
    pergunta:
      "Qual música marca a despedida política de George Washington?",
    alternativaA: "One Last Time",
    alternativaB: "History Has Its Eyes on You",
    alternativaC: "Right Hand Man",
    alternativaD: "Cabinet Battle #2",
    alternativaE: "Non-Stop",
    alternativaCorreta: "alternativaA",
  },

  {
    pergunta:
      "Qual ideia aparece constantemente em Hamilton como uma obsessão de Hamilton?",
    alternativaA: "Honra familiar",
    alternativaB: "Religião",
    alternativaC: "Controle militar",
    alternativaD: "Legado e memória histórica",
    alternativaE: "Expansão territorial",
    alternativaCorreta: "alternativaD",
  },
];

  // variáveis globais
  let numeroDaQuestaoAtual = 0;
  let pontuacaoFinal = 0;
  let tentativaIncorreta = 0;
  let certas = 0;
  let erradas = 0;
  let quantidadeDeQuestoes = listaDeQuestoes.length;
  // let isUltima = numeroDaQuestaoAtual == quantidadeDeQuestoes-1 ? true : false

  function onloadEsconder() {
    document.getElementById("pontuacao").style.display = "none";
    document.getElementById("jogo").style.display = "none";
  }

  function iniciarQuiz() {
    document.getElementById("pontuacao").style.display = "flex";
    document.getElementById("jogo").style.display = "flex";
    document.getElementById("btnIniciarQuiz").style.display = "none";

    document.getElementById("qtdQuestoes").innerHTML = quantidadeDeQuestoes;

    preencherHTMLcomQuestaoAtual(0);

    btnSubmeter.disabled = false;
    btnProx.disabled = true;
    // btnConcluir.disabled = true
    btnTentarNovamente.disabled = true;
  }

  function preencherHTMLcomQuestaoAtual(index) {
    habilitarAlternativas(true);
    const questaoAtual = listaDeQuestoes[index];
    numeroDaQuestaoAtual = index;
    console.log("questaoAtual");
    console.log(questaoAtual);
    document.getElementById("spanNumeroDaQuestaoAtual").innerHTML =
      Number(index) + 1; // ajustando porque o index começa em 0
    document.getElementById("spanQuestaoExibida").innerHTML =
      questaoAtual.pergunta;
    document.getElementById("labelOpcaoUm").innerHTML =
      questaoAtual.alternativaA;
    document.getElementById("labelOpcaoDois").innerHTML =
      questaoAtual.alternativaB;
    document.getElementById("labelOpcaoTres").innerHTML =
      questaoAtual.alternativaC;
    document.getElementById("labelOpcaoQuatro").innerHTML =
      questaoAtual.alternativaD;
  }

  function submeter() {
    const options = document.getElementsByName("option"); // recupera alternativas no html

    let hasChecked = false;
    for (let i = 0; i < options.length; i++) {
      if (options[i].checked) {
        hasChecked = true;
        break;
      }
    }

    if (!hasChecked) {
      alert("Não há alternativas escolhidas. Escolha uma opção.");
    } else {
      btnSubmeter.disabled = true;
      btnProx.disabled = false;

      habilitarAlternativas(false);

      checarResposta();
    }
  }

  function habilitarAlternativas(trueOrFalse) {
    let opcaoEscolhida = trueOrFalse ? false : true;

    primeiraOpcao.disabled = opcaoEscolhida;
    segundaOpcao.disabled = opcaoEscolhida;
    terceiraOpcao.disabled = opcaoEscolhida;
    quartaOpcao.disabled = opcaoEscolhida;
  }

  function avancar() {
    btnProx.disabled = true;
    btnSubmeter.disabled = false;

    desmarcarRadioButtons();

    if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {
      preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);
    } else if (numeroDaQuestaoAtual == quantidadeDeQuestoes - 1) {
      alert("Atenção... a próxima é a ultima questão!");
      preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);
    } else {
      finalizarJogo();
    }
    limparCoresBackgroundOpcoes();
  }

  function tentarNovamente() {
    // atualiza a página
    window.location.reload();
  }

  function checarResposta() {
    const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual]; // questão atual
    const respostaQuestaoAtual = questaoAtual.alternativaCorreta; // qual é a resposta correta da questão atual

    const options = document.getElementsByName("option"); // recupera alternativas no html

    let alternativaCorreta = null; // variável para armazenar a alternativa correta

    options.forEach((option) => {
      if (option.value === respostaQuestaoAtual) {
        console.log(
          "alternativaCorreta está no componente: " + alternativaCorreta,
        );
        alternativaCorreta = option.labels[0].id;
      }
    });

    // verifica se resposta assinalada é correta
    options.forEach((option) => {
      if (option.checked === true && option.value === respostaQuestaoAtual) {
        document
          .getElementById(alternativaCorreta)
          .classList.add("text-success-with-bg");
        pontuacaoFinal++;
        certas++;
        document.getElementById("spanCertas").innerHTML = certas;
        numeroDaQuestaoAtual++;
      } else if (option.checked && option.value !== respostaQuestaoAtual) {
        const wrongLabelId = option.labels[0].id;

        document
          .getElementById(wrongLabelId)
          .classList.add("text-danger-with-bg");
        document
          .getElementById(alternativaCorreta)
          .classList.add("text-success-with-bg");
        tentativaIncorreta++;
        erradas++;
        document.getElementById("spanErradas").innerHTML = erradas;
        numeroDaQuestaoAtual++;
      }
    });
  }

  function limparCoresBackgroundOpcoes() {
    const options = document.getElementsByName("option");
    options.forEach((option) => {
      document
        .getElementById(option.labels[0].id)
        .classList.remove("text-danger-with-bg");
      document
        .getElementById(option.labels[0].id)
        .classList.remove("text-success-with-bg");
    });
  }

  function desmarcarRadioButtons() {
    const options = document.getElementsByName("option");
    for (let i = 0; i < options.length; i++) {
      options[i].checked = false;
    }
  }

  function finalizarJogo() {
    let textoParaMensagemFinal = null;
    let classComCoresParaMensagemFinal = null;
    const porcentagemFinalDeAcertos = pontuacaoFinal / quantidadeDeQuestoes;

    pontuacaoFinalJogo.style.display = "flex"

    if (porcentagemFinalDeAcertos <= 0.3) {
      textoParaMensagemFinal = "Parece que você não conhece muito do universo...";
      classComCoresParaMensagemFinal = "text-danger-with-bg";
    } else if (
      porcentagemFinalDeAcertos > 0.3 &&
      porcentagemFinalDeAcertos < 0.9
    ) {
      textoParaMensagemFinal = "Pode melhorar na próxima, hein!";
      classComCoresParaMensagemFinal = "text-warning-with-bg";
    } else if (porcentagemFinalDeAcertos >= 0.9) {
      textoParaMensagemFinal = "Uau, você é um verdadeiro Hamilfans";
      classComCoresParaMensagemFinal = "text-success-with-bg";
    }

    textoParaMensagemFinal +=
      "<br> Você acertou " +
      Math.round(porcentagemFinalDeAcertos * 100) +
      "% das questões.";

    document.getElementById("msgFinal").innerHTML = textoParaMensagemFinal;
    document
      .getElementById("msgFinal")
      .classList.add(classComCoresParaMensagemFinal);
    document.getElementById("spanPontuacaoFinal").innerHTML = pontuacaoFinal;

    document.getElementById("jogo").classList.add("text-new-gray");

    btnProx.disabled = true;
    btnSubmeter.disabled = true;
    // btnConcluir.disabled = true
    btnTentarNovamente.disabled = false;

    const idUsuario = getIdUsuarioSessao();

    console.log('ID_USUARIO da sessão:', idUsuario);

    if (!idUsuario) {
      console.error('ID_USUARIO inválido ou não encontrado na sessão. Usuário pode não estar logado.');
      return;
    }

    const body = {
      idUsuario: idUsuario,
      pontos: pontuacaoFinal
    };
    console.log('Enviando body de pontos:', body);

    fetch("/pontos/adicionar-pontos", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify(body),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          const pontosAtuais = Number(sessionStorage.getItem('PONTOS_USUARIO') || 0);
          const novosPontos = pontosAtuais + Number(pontuacaoFinal || 0);
          sessionStorage.setItem('PONTOS_USUARIO', String(novosPontos));
          window.dispatchEvent(new CustomEvent('pontosAtualizados', { detail: { pontosUsuario: novosPontos } }));
          cardErro.style.display = "block";
        } 
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }
  
</script>
